name: Build Android APK

# Every push to dev (or main) produces a ready-to-install APK.
# Download it from the run's Artifacts, or from the "dev-build" prerelease
# on the Releases page — open that link on your phone's browser and install.
# No AI Studio, no local Flutter toolchain needed.

on:
  push:
    branches: [dev, main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to publish the downloadable prerelease

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding (preserve our manifest)
        run: |
          # The repo carries lib/ + pubspec.yaml + a custom AndroidManifest.xml,
          # but not the full android/ gradle project. Regenerate the platform
          # files, keeping our manifest (permissions, share intents, mic service).
          mkdir -p _keep
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml _keep/AndroidManifest.xml
          fi
          flutter create . --platforms=android --project-name recall --org com.recall
          if [ -f _keep/AndroidManifest.xml ]; then
            cp _keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Raise minSdk to 26 (mic + on-device models)
        run: |
          # Handle both Groovy and Kotlin gradle DSLs across Flutter versions.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts || true
            sed -i 's/minSdkVersion(flutter.minSdkVersion)/minSdk = 26/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle || true
          fi

      - name: Fetch packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: recall-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish downloadable prerelease (dev only)
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Recall — latest dev build
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
