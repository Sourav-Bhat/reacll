name: recall
description: "Recall - personal conversation memory. Record, import, transcribe on-device, tag people, search everything."
publish_to: 'none'
version: 0.5.1+15

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # capture
  record: ^6.2.0                    # mic recording (wav 16k mono for whisper)
  # transcription (whisper.cpp via FFI, on-device, auto model download)
  whisper_ggml: ^1.7.0
  # decode imported audio (m4a/mp3/…) -> 16 kHz mono WAV for whisper
  ffmpeg_kit_flutter_new_min: ^2.1.0
  # Phase 3: on-device speaker diarization + voice identity (next-gen Kaldi)
  sherpa_onnx: ^1.13.2
  archive: ^3.6.1                   # unpack segmentation model tar.bz2
  # storage - bundled modern SQLite with FTS5 guaranteed
  sqlite3: ^3.5.0
  sqlite3_flutter_libs: ^0.5.24
  # imports
  receive_sharing_intent: ^1.8.1    # Android share-sheet (audio + text)
  file_picker: ^8.1.2
  # infra
  http: ^1.2.2                      # Phase 2: Claude API (text-only extraction)
  path_provider: ^2.1.4
  path: ^1.9.0
  cryptography: ^2.7.0              # PBKDF2 + AES-GCM for encrypted backup
  flutter_gemma: ^0.15.0           # W14: on-device Gemma (fully offline) LLM
  audioplayers: ^6.1.0             # play back imported/recorded audio
  intl: ^0.19.0
  google_fonts: ^6.2.1              # Fraunces + Inter (2026 design)
  package_info_plus: ^8.0.0        # show app version in Settings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
